<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function syori(){
            let nyuryoku = document.getElementById("nyuryoku").value;
            let syutsuryoku = document.getElementById("syutsuryoku");
            syutsuryoku.innerHTML = nyuryoku;
        }
    </script>
</head>
<body>
 <input id="nyuryoku" type="text"> 
 <input type="button" value="入力する" onclick="syori()">
 <div id="syutsuryoku">ここに表示されます</div>  

</body>
</html>
